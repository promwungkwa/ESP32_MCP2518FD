[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = time, default

; Library Dependencies
lib_deps =
    pierremolinaro/ACAN2517FD @ ^2.1.11

; Build flags to optimize performance
build_flags =
    -D CORE_DEBUG_LEVEL=3  ; Enables detailed serial logs for debugging hardware issues
        ; ── MCP2518FD oscillator frequency ───────────────────────────────
    ; 40 MHz = typical for most breakout boards
    ; Change to 20000000 if your board has a 20 MHz crystal
    -D CAN_CLOCK_FREQ=20000000
